<circle cx='341.5' cy='82' r='22' fill='#ff3b3b'><animate attributeName='r' values='22;27;22;22' keyTimes='0;0.1;0.25;1' dur='2.4s' begin='0.6s' repeatCount='indefinite'/></circle>
<text x='341.5' y='90' text-anchor='middle' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='22' font-weight='700' fill='#fff'>2</text>
<text x='341.5' y='138' text-anchor='middle' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='19' font-weight='700' fill='#f2f3f7'>Join WiFi</text>
<text x='341.5' y='164' text-anchor='middle' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13.5' fill='#9aa0ad'>MatrixClock-XXXX</text>
<text x='341.5' y='184' text-anchor='middle' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13.5' fill='#9aa0ad'>on your phone</text>
