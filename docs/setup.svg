<path d='M440.0 125 l18 0 m-7 -7 l7 7 l-7 7' fill='none' stroke='#5a5f6b' stroke-width='3' stroke-linecap='round'/>
<g>
<rect x='466.0' y='40' width='185' height='170' rx='16' fill='#1c1f28' stroke='#3a3f4b' stroke-width='2'><animate attributeName='stroke' values='#3a3f4b;#ff3b3b;#ff3b3b;#3a3f4b' keyTimes='0;0.1;0.25;0.35' dur='2.4s' begin='1.2s' repeatCount='indefinite'/></rect>
<circle cx='558.5' cy='82' r='22' fill='#ff3b3b'><animate attributeName='r' values='22;27;22;22' keyTimes='0;0.1;0.25;1' dur='2.4s' begin='1.2s' repeatCount='indefinite'/></circle>
