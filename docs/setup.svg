<text x='124.5' y='164' text-anchor='middle' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13.5' fill='#9aa0ad'>Clock shows</text>
<text x='124.5' y='184' text-anchor='middle' font-family='Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13.5' fill='#9aa0ad'>"WiFi setup"</text>
</g>
<path d='M223.0 125 l18 0 m-7 -7 l7 7 l-7 7' fill='none' stroke='#5a5f6b' stroke-width='3' stroke-linecap='round'/>
