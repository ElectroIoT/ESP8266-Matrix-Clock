<circle cx='775.5' cy='82' r='22' fill='#ff3b3b'><animate attributeName='r' values='22;27;22;22' keyTimes='0;0.1;0.25;1' dur='2.4s' begin='1.7999999999999998s' repeatCount='indefinite'/></circle>
