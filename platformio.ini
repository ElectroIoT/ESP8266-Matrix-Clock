; ESP8266 Matrix Clock -- NodeMCU / Wemos D1 mini + 4x MAX7219 (8x32)
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 160000000L
lib_deps =
    majicdesigns/MD_MAX72XX @ ^3.5.1

; Wemos D1 mini: same pins (D5/D7/D6), no FLASH button -- WiFi setup still opens by itself
[env:d1_mini]
extends = env:nodemcuv2
board = d1_mini
